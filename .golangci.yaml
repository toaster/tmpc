run:
  timeout: 10m

linters:
  enable:
    - goimports
    - gosec
    - govet
    - revive
    - staticcheck
    - unconvert
    - unused

linters-settings:
  revive:
    severity: error
    enable-all-rules: true
    confidence: 0.6 # default is 0.8; raise if revive reports false positives
    rules:
      - name: add-constant
        arguments:
          - allowInts: "0,1,2,3"
            allowStrs: '""'
        exclude:
          - "**/*_test.go"
      - name: argument-limit
        disabled: true
      - name: bare-return
        disabled: true
      - name: cognitive-complexity
        disabled: true
      - name: cyclomatic
        disabled: true
      - name: flag-parameter
        disabled: true
      - name: function-length
        disabled: true
      - name: line-length-limit
        disabled: true
      - name: unhandled-error
        arguments:
          - ".*\\.WriteString"
          - ".*\\.WriteRune"
